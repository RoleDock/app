<header class="app-header">
  <a class="brand" routerLink="/profile" aria-label="RoleDock, accueil">RoleDock<span aria-hidden="true"></span></a>
  <nav aria-label="Navigation principale">
    <a routerLink="/profile" routerLinkActive="active" ariaCurrentWhenActive="page">
      <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
      Profil candidat
    </a>
    <a routerLink="/job-offers/new" routerLinkActive="active" ariaCurrentWhenActive="page" [routerLinkActiveOptions]="{ exact: true }">
      <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h5M12 15v4M10 17h4"/></svg>
      Nouvelle offre
    </a>
  </nav>
  <div class="theme-switch" role="group" aria-label="Thème de l’application">
    <button type="button" aria-label="Thème clair" title="Thème clair" [attr.aria-pressed]="themeService.theme() === 'light'" (click)="themeService.setTheme('light')">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none">
        <g stroke="currentColor" stroke-width="1.5" stroke-miterlimit="10">
<path d="M5 12H1M23 12h-4M7.05 7.05 4.222 4.222M19.778 19.778 16.95 16.95M7.05 16.95l-2.828 2.828M19.778 4.222 16.95 7.05" stroke-linecap="round"/>
<path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z" fill="currentColor" fill-opacity=".16"/>
<path d="M12 19v4M12 1v4" stroke-linecap="round"/>
</g>
      </svg>
    </button>
    <button type="button" aria-label="Thème sombre" title="Thème sombre" [attr.aria-pressed]="themeService.theme() === 'dark'" (click)="themeService.setTheme('dark')">
      <svg aria-hidden="true" focusable="false" viewBox="0 0 24 24" fill="none">
        <g fill="currentColor">
<path d="M12 0a1 1 0 0 1 1 1v4a1 1 0 1 1-2 0V1a1 1 0 0 1 1-1ZM4.929 3.515a1 1 0 0 0-1.414 1.414l2.828 2.828a1 1 0 0 0 1.414-1.414L4.93 3.515ZM1 11a1 1 0 1 0 0 2h4a1 1 0 1 0 0-2H1ZM18 12a1 1 0 0 1 1-1h4a1 1 0 1 1 0 2h-4a1 1 0 0 1-1-1ZM17.657 16.243a1 1 0 0 0-1.414 1.414l2.828 2.828a1 1 0 1 0 1.414-1.414l-2.828-2.828ZM7.757 17.657a1 1 0 1 0-1.414-1.414L3.515 19.07a1 1 0 1 0 1.414 1.414l2.828-2.828ZM20.485 4.929a1 1 0 0 0-1.414-1.414l-2.828 2.828a1 1 0 1 0 1.414 1.414l2.828-2.828ZM13 19a1 1 0 1 0-2 0v4a1 1 0 1 0 2 0v-4ZM12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Z"/>
</g>
      </svg>
    </button>
  </div>
</header>
